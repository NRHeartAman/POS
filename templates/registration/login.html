<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CraveCast POS</title>
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; display:grid; place-items:center; padding:20px; background:#080808; color:#f7f7f7;
       font-family:'Aptos', 'Aptos Display', 'Segoe UI', sans-serif; color-scheme:dark; }
    .box { width:min(380px, 100%); background:#111111; border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:32px 28px; }
    .brand { display:flex; align-items:center; gap:10px; font-family:'Aptos Display', 'Aptos', 'Segoe UI', sans-serif; font-weight:800; font-size:22px; margin-bottom:6px; }
    .brand i { color:#fff; font-size:30px; } .brand span { color:#fff; }
    p { color:#a3a3a3; font-size:13px; margin-bottom:22px; }
    label { display:block; font-size:12px; font-weight:600; color:#a3a3a3; margin-bottom:6px; }
    input { width:100%; padding:12px 14px; border-radius:6px; border:1px solid rgba(255,255,255,.12); background:#191919; color:#f7f7f7;
        font:inherit; margin-bottom:14px; }
    input:focus { outline:none; border-color:#fff; }
    button { width:100%; padding:13px; border:none; border-radius:6px; background:#fff; color:#080808; font:inherit; font-weight:700; cursor:pointer; }
    button:hover { background:#dedede; }
    .err { background:#242424; color:#fff; border-left:3px solid #fff; padding:10px 12px; border-radius:4px; font-size:13px; margin-bottom:14px; }
</style>
</head>
<body>
<form class="box" method="post">
    {% csrf_token %}
    <div class="brand"><i class='bx bxs-store'></i><span>Crave<span>Cast</span> POS</span></div>
    <p>Sign in to open the register.</p>
    {% if form.errors %}<div class="err">Wrong username or password.</div>{% endif %}
    <label for="id_username">Username</label>
    <input id="id_username" name="username" autocomplete="username" autofocus required>
    <label for="id_password">Password</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
</form>
</body>
</html>
